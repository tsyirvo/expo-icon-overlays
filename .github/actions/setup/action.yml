name: Set up toolchain
description: Install selected mise tools, then select the job's Node version.

inputs:
  node-version:
    description: Node version to use for this job
    required: true
  tools:
    description: Tools from mise.toml to install
    required: false
    default: bun

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        install_args: ${{ inputs.tools }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

name: Set up toolchain
description: Install selected mise tools, then select the job's Node version.

inputs:
  node-version:
    description: Node version to use for this job
    required: true
  tools:
    description: Tools from mise.toml to install
    required: false
    default: bun

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        install_args: ${{ inputs.tools }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
